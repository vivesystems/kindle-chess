<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="keywords" content="Chess, Kindle, Paperwhite" />
    <title>Kindle Chess</title>
    <link href="stylesheets/styles.css?v=1.14.0" rel="stylesheet" type="text/css" />
    <script type="text/javascript">
      if (!window.console) console = { log: function () {} };
    </script>
  </head>
  <body>
    <div id="app">
      <div id="setup">
        <h1>Kindle Chess</h1>
        <button type="button" class="setup-choice" id="normal-game">Normal</button>
        <button type="button" class="setup-choice" id="test-black">Test with opponent Black</button>
        <button type="button" class="setup-choice" id="test-white">Test with opponent White</button>
        <button type="button" class="setup-choice" id="benchmark-menu">Benchmark</button>
        <span id="setup-version"></span>
      </div>
      <div id="game">
      <div id="board"></div>
      <div id="panel">
        <div id="difficulty-row">
          <label for="difficulty">Difficulty (approx. Elo)</label>
          <select id="difficulty">
            <option value="1000" selected="selected">1000</option>
            <option value="1200">1200</option>
            <option value="1400">1400</option>
          </select>
        </div>
        <div id="status-row">
          <div id="status-info">
            <div id="status">Loading</div>
            <div id="stats"></div>
          </div>
          <div id="time-row">
            Time
            <select id="time">
              <option value="0.5">0.5s</option>
              <option value="1" selected="selected">1s</option>
              <option value="2">2s</option>
              <option value="4">4s</option>
              <option value="6">6s</option>
              <option value="8">8s</option>
              <option value="10">10s</option>
            </select>
          </div>
        </div>
        <div id="controls">
          <div id="button-row">
            <button type="button" id="new">New</button>
            <button type="button" id="flip">Flip</button>
            <button type="button" id="undo">Undo</button>
            <button type="button" id="go">Move</button>
            <button type="button" id="auto" aria-pressed="false">Auto</button>
          </div>
          <span id="version"></span>
        </div>
      </div>
      </div>
      <div id="benchmark">
        <h1>Benchmark</h1>
        <div id="benchmark-version"></div>
        <div id="benchmark-config"></div>
        <div id="benchmark-estimate"></div>
        <div id="benchmark-progress">Ready</div>
        <div id="benchmark-bar"><div id="benchmark-bar-fill"></div></div>
        <div id="benchmark-current"></div>
        <div id="benchmark-actions">
          <button type="button" id="benchmark-start">Start</button>
          <button type="button" id="benchmark-stop" disabled="disabled">Stop</button>
          <button type="button" id="benchmark-details-toggle">Details</button>
          <button type="button" id="benchmark-back">Back</button>
        </div>
        <div id="benchmark-summary"></div>
        <div id="benchmark-detail"></div>
        <div id="benchmark-pages">
          <button type="button" id="benchmark-prev">Previous</button>
          <span id="benchmark-page"></span>
          <button type="button" id="benchmark-next">Next</button>
        </div>
      </div>
    </div>
    <script src="js/engine.js?v=2.3.0"></script>
    <script src="js/gui.js?v=1.14.0"></script>
  </body>
</html>
